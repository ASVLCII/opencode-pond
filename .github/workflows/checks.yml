name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: bun test
      - name: Check installer with isolated config
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $configDirectory = Join-Path $env:RUNNER_TEMP 'pond-config'
          ./scripts/install.ps1 -ConfigDirectory $configDirectory
          $config = Get-Content (Join-Path $configDirectory 'cli.json') -Raw | ConvertFrom-Json
          $expected = (Join-Path $configDirectory 'extensions/opencode-pond').Replace('\', '/')
          if (@($config.plugins) -notcontains $expected) { throw 'Pond was not registered' }
